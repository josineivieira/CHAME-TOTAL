name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chame_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: chame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chame_test -d chame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chame_test:ci_ephemeral_only@127.0.0.1:5432/chame_test
      NODE_ENV: test
      APP_ORIGIN: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @chame/api
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: docs/qa/*.png
          if-no-files-found: ignore
